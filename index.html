<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Wallet - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* Match device theme automatically */
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
        }
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-b from-white to-gray-50 dark:from-[#071021] dark:to-[#001021] text-gray-900 dark:text-gray-100 transition-colors duration-500 min-h-screen flex flex-col"
  >
    <main
      class="flex-grow flex flex-col items-center justify-center px-6 text-center"
    >
      <!-- Logo -->
      <div class="mb-8">
        <div
          class="w-24 h-24 mx-auto rounded-3xl bg-green-600 flex items-center justify-center"
        >
          <i class="fa-solid fa-landmark text-white text-5xl"></i>
        </div>
      </div>

      <!-- Title & Description -->
      <h1 class="text-3xl md:text-4xl font-bold mb-3">
        Welcome to <span class="text-green-500">Bank Wallet</span>
      </h1>
      <p class="text-gray-600 dark:text-gray-300 mb-8 max-w-md mx-auto">
        Securely manage your digital assets and earn through our mining platform.
        Simple, fast, and secure — all in one wallet.
      </p>

      <!-- Get Started Button -->
      <a
        href="start.html"
        class="px-8 py-3 rounded-lg bg-green-600 hover:bg-green-700 text-white font-medium transition"
      >
        Get Started
      </a>
    </main>

    <!-- Footer -->
    <footer
      class="w-full py-4 text-center text-xs text-gray-500 dark:text-gray-400 border-t border-gray-200 dark:border-gray-800"
    >
      © 2026 Bank Wallet — Secure. Smart. Seamless.
    </footer>
  </body>
</html>
